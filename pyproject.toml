[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicedesk"
version = "0.2.0"
description = "Voice-controlled desktop assistant with a local-first brain"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Akshat Jaiswal" }]
keywords = ["voice", "assistant", "automation", "desktop", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.0,<2.0",
    "sounddevice>=0.4,<0.6",
    "numpy>=1.26,<3.0",
    "mss>=9.0,<11.0",
    "pytesseract>=0.3.10,<0.4",
    "Pillow>=10.0,<12.0",
    "pyautogui>=0.9.54,<1.0",
    "pyttsx3>=2.90,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]
# Windows accessibility-tree grounding. Optional because the rest of the
# project runs without it, falling back to coordinates.
windows = ["uiautomation>=2.0,<3.0"]

[project.scripts]
voicedesk = "voicedesk.main:run"

[project.urls]
Repository = "https://github.com/akshat029/voice-desk"
Issues = "https://github.com/akshat029/voice-desk/issues"

[tool.setuptools.packages.find]
include = ["voicedesk*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # pydantic Field(...) in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, to pin internal invariants.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Deliberately not strict yet. The GUI and audio libraries here ship no
# type information, and demanding full annotations before the interfaces
# have settled would mean a wall of noise rather than caught bugs.
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyautogui", "pyttsx3", "sounddevice", "mss", "pytesseract", "uiautomation", "faster_whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:voicedesk.*"]
